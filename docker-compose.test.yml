version: '3.9'

# Overrides for integration testing with a fake API key
services:
  image-mcp:
    build: .
    ports:
      - "3001:3000"
    environment:
      - IMAGE_PROVIDER=openai
      - IMAGE_API_KEY=sk-test-fake-key-for-ci
      - IMAGE_MCP_TRANSPORT=http
      - IMAGE_PORT=3000
      - IMAGE_LOG_LEVEL=error
      - IMAGE_MAX_REQUESTS_PER_MINUTE=100
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
